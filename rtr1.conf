configure

set system host-name rtr1

# Management side toward Ubuntu desktop / upstream LAN
set interfaces ethernet eth0 description 'Desktop side'
set interfaces ethernet eth0 address '10.0.0.50/24'

# Management VLAN / subnet
set interfaces ethernet eth1 description 'Management subnet'
set interfaces ethernet eth1 address '10.10.10.1/24'

# Server VLAN / subnet
set interfaces ethernet eth2 description 'Server subnet'
set interfaces ethernet eth2 address '10.10.20.1/24'

# (Optional) add more internal segments:
# Security, attacker, etc.
# set interfaces ethernet eth3 description 'Security subnet'
# set interfaces ethernet eth3 address '10.10.30.1/24'
# set interfaces ethernet eth4 description 'Attacker subnet'
# set interfaces ethernet eth4 address '10.10.40.1/24'

# Enable routing
set protocols static route 0.0.0.0/0 next-hop '10.0.0.1'

commit
save
exit